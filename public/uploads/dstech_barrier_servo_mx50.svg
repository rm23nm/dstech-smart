<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Studio Floor Shadow -->
  <ellipse cx="400" cy="620" rx="280" ry="42" fill="#0f172a" opacity="0.16" filter="blur(14px)"/>

  <!-- Top Studio Header Badge -->
  <rect x="50" y="45" width="220" height="34" rx="8" fill="#0f172a"/>
  <circle cx="70" cy="62" r="6" fill="#0284c7"/>
  <circle cx="70" cy="62" r="3" fill="#38bdf8"/>
  <text x="86" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">DSTECH SMART</text>
  
  <rect x="530" y="45" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">GENUINE TEKNO20 HW</text>

  <!-- Product Hardware Drawing -->
  <g filter="url(#studioShadow)">
    
        <!-- Barrier Gate MX50 Cabinet -->
        <rect x="270" y="150" width="260" height="460" rx="28" fill="#ea580c" stroke="#c2410c" stroke-width="4"/>
        <!-- Front Inset Dark Panel -->
        <rect x="300" y="200" width="200" height="370" rx="18" fill="#0f172a"/>
        <!-- LED Status Panel / Flow Indicator -->
        <rect x="340" y="230" width="120" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <circle cx="370" cy="250" r="10" fill="#22c55e"/>
        <text x="415" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">OPEN</text>
        <!-- Digital Display -->
        <rect x="330" y="295" width="140" height="85" rx="10" fill="#020617" stroke="#1e293b" stroke-width="2"/>
        <text x="400" y="335" font-family="Courier, monospace" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle">0.6s</text>
        <text x="400" y="360" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">SPEED CONTROL</text>
        <!-- Motor / Housing Logo Badge -->
        <rect x="335" y="410" width="130" height="45" rx="8" fill="#1e293b"/>
        <text x="400" y="437" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#f8fafc" text-anchor="middle">MX-50 SERVO</text>
        <!-- Ventilation Grille -->
        <line x1="330" y1="480" x2="470" y2="480" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="330" y1="500" x2="470" y2="500" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="330" y1="520" x2="470" y2="520" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="330" y1="540" x2="470" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <!-- Boom Arm Bracket Hub on Left -->
        <circle cx="270" cy="220" r="38" fill="#475569" stroke="#1e293b" stroke-width="4"/>
        <circle cx="270" cy="220" r="16" fill="#0f172a"/>
        <!-- Barrier Boom Arm Stub with Glow -->
        <rect x="70" y="206" width="200" height="28" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="3"/>
        <line x1="100" y1="206" x2="120" y2="234" stroke="#dc2626" stroke-width="8"/>
        <line x1="140" y1="206" x2="160" y2="234" stroke="#dc2626" stroke-width="8"/>
        <line x1="180" y1="206" x2="200" y2="234" stroke="#dc2626" stroke-width="8"/>
        <line x1="220" y1="206" x2="240" y2="234" stroke="#dc2626" stroke-width="8"/>
        
  </g>

  <!-- Product Title & Details Footer -->
  <g transform="translate(400, 685)">
    <rect x="-350" y="0" width="700" height="80" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="0" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">MESIN BARRIER GATE SERVO DC MX-50</text>
    <text x="0" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">BRUSHLESS MOTOR 0.6s - 1.2s • IP66 WATERPROOF • HEAVY DUTY 100% DUTY CYCLE</text>
  </g>
</svg>