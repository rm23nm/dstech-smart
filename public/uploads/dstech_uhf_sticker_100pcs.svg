<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Studio Floor Shadow -->
  <ellipse cx="400" cy="620" rx="280" ry="42" fill="#0f172a" opacity="0.16" filter="blur(14px)"/>

  <!-- Top Studio Header Badge -->
  <rect x="50" y="45" width="220" height="34" rx="8" fill="#0f172a"/>
  <circle cx="70" cy="62" r="6" fill="#0284c7"/>
  <circle cx="70" cy="62" r="3" fill="#38bdf8"/>
  <text x="86" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">DSTECH SMART</text>
  
  <rect x="530" y="45" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">GENUINE TEKNO20 HW</text>

  <!-- Product Hardware Drawing -->
  <g filter="url(#studioShadow)">
    
        <!-- Packaging Box of 100 Pcs -->
        <rect x="180" y="240" width="220" height="280" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="4"/>
        <rect x="195" y="255" width="190" height="60" rx="8" fill="#4f46e5"/>
        <text x="290" y="292" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">BOX 100 PCS</text>
        <text x="290" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">UHF RFID TAGS</text>
        <text x="290" y="385" font-family="Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">ANTI-PEEL WINDSHIELD</text>
        <!-- RFID Inlay Transparent Sticker (Expanded View) -->
        <g transform="translate(390, 220)">
          <rect x="20" y="20" width="230" height="130" rx="14" fill="#f8fafc" stroke="#6366f1" stroke-width="3" opacity="0.95"/>
          <!-- RFID Microchip Antenna Coil Inlay Pattern -->
          <path d="M 40,65 Q 80,45 135,45 Q 190,45 230,65" fill="none" stroke="#6366f1" stroke-width="3"/>
          <path d="M 40,85 Q 80,105 135,105 Q 190,105 230,85" fill="none" stroke="#6366f1" stroke-width="3"/>
          <rect x="125" y="65" width="20" height="20" rx="4" fill="#4338ca"/>
          <text x="135" y="128" font-family="Courier, monospace" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">EPC: 3008 33B2 DDD9</text>
        </g>
        <g transform="translate(420, 370)">
          <rect x="20" y="20" width="230" height="130" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="3" opacity="0.95"/>
          <path d="M 40,65 Q 80,45 135,45 Q 190,45 230,65" fill="none" stroke="#475569" stroke-width="3"/>
          <rect x="125" y="65" width="20" height="20" rx="4" fill="#1e293b"/>
          <text x="135" y="128" font-family="Courier, monospace" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">GEN2 TAMPER-PROOF</text>
        </g>
        
  </g>

  <!-- Product Title & Details Footer -->
  <g transform="translate(400, 685)">
    <rect x="-350" y="0" width="700" height="80" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="0" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">UHF WINDSHIELD TAG STICKER (100 PCS)</text>
    <text x="0" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ANTI-TEAR & ANTI-TAMPER RFID • 915 MHz • 10M LONG RANGE • BOX 100 UNIT</text>
  </g>
</svg>