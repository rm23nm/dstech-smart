<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Studio Floor Shadow -->
  <ellipse cx="400" cy="620" rx="280" ry="42" fill="#0f172a" opacity="0.16" filter="blur(14px)"/>

  <!-- Top Studio Header Badge -->
  <rect x="50" y="45" width="220" height="34" rx="8" fill="#0f172a"/>
  <circle cx="70" cy="62" r="6" fill="#0284c7"/>
  <circle cx="70" cy="62" r="3" fill="#38bdf8"/>
  <text x="86" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">DSTECH SMART</text>
  
  <rect x="530" y="45" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">GENUINE TEKNO20 HW</text>

  <!-- Product Hardware Drawing -->
  <g filter="url(#studioShadow)">
    
        <!-- Luxury Black Glass Smart Lock Escutcheon Plate -->
        <rect x="310" y="140" width="180" height="470" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4"/>
        <rect x="325" y="155" width="150" height="440" rx="28" fill="#1e293b"/>
        
        <!-- Numeric Touch Keypad -->
        <g transform="translate(350, 190)" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
          <circle cx="20" cy="20" r="14" fill="#0f172a"/><text x="20" y="25">1</text>
          <circle cx="50" cy="20" r="14" fill="#0f172a"/><text x="50" y="25">2</text>
          <circle cx="80" cy="20" r="14" fill="#0f172a"/><text x="80" y="25">3</text>
          <circle cx="20" cy="55" r="14" fill="#0f172a"/><text x="20" y="60">4</text>
          <circle cx="50" cy="55" r="14" fill="#0f172a"/><text x="50" y="60">5</text>
          <circle cx="80" cy="55" r="14" fill="#0f172a"/><text x="80" y="60">6</text>
          <circle cx="20" cy="90" r="14" fill="#0f172a"/><text x="20" y="95">7</text>
          <circle cx="50" cy="90" r="14" fill="#0f172a"/><text x="50" y="95">8</text>
          <circle cx="80" cy="90" r="14" fill="#0f172a"/><text x="80" y="95">9</text>
        </g>
        
        <!-- Reversible Ergonomic Handle with Integrated Fingerprint Sensor -->
        <g transform="translate(260, 360)">
          <rect x="110" y="0" width="60" height="50" rx="12" fill="#475569" stroke="#0f172a" stroke-width="2"/>
          <rect x="0" y="5" width="130" height="38" rx="14" fill="#334155" stroke="#1e293b" stroke-width="2"/>
          <!-- Biometric Fingerprint Circle on Handle Pivot -->
          <circle cx="120" cy="24" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
        </g>
        
        <!-- Mechanical Cylinder Hole -->
        <circle cx="400" cy="530" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
        
  </g>

  <!-- Product Title & Details Footer -->
  <g transform="translate(400, 685)">
    <rect x="-350" y="0" width="700" height="80" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="0" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">TUYA WIFI SMART DOOR LOCK DIGITAL</text>
    <text x="0" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">FINGERPRINT • 3D FACE • PASSCODE • RFID • MORTISE SUS304 • TUYA SMART APP • EMERGENCY KEY</text>
  </g>
</svg>