<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Studio Floor Shadow -->
  <ellipse cx="400" cy="620" rx="280" ry="42" fill="#0f172a" opacity="0.16" filter="blur(14px)"/>

  <!-- Top Studio Header Badge -->
  <rect x="50" y="45" width="220" height="34" rx="8" fill="#0f172a"/>
  <circle cx="70" cy="62" r="6" fill="#0284c7"/>
  <circle cx="70" cy="62" r="3" fill="#38bdf8"/>
  <text x="86" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">DSTECH SMART</text>
  
  <rect x="530" y="45" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">GENUINE TEKNO20 HW</text>

  <!-- Product Hardware Drawing -->
  <g filter="url(#studioShadow)">
    
        <!-- Outdoor Ticket Dispenser Pillar / Pos Kasir Housing -->
        <rect x="270" y="140" width="260" height="470" rx="26" fill="#ea580c" stroke="#c2410c" stroke-width="4"/>
        <rect x="295" y="170" width="210" height="410" rx="16" fill="#0f172a"/>
        
        <!-- LCD Display Window -->
        <rect x="320" y="200" width="160" height="70" rx="8" fill="#020617" stroke="#1e293b" stroke-width="2"/>
        <text x="400" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">TEKAN TOMBOL</text>
        
        <!-- Big Push Button for Ticket -->
        <circle cx="400" cy="330" r="38" fill="#22c55e" stroke="#16a34a" stroke-width="4" filter="url(#softGlow)"/>
        <circle cx="400" cy="330" r="24" fill="#15803d"/>
        <text x="400" y="337" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TIKET</text>
        
        <!-- Ticket Exit Mouth Slot -->
        <rect x="330" y="400" width="140" height="18" rx="4" fill="#020617" stroke="#475569" stroke-width="2"/>
        <line x1="340" y1="409" x2="460" y2="409" stroke="#94a3b8" stroke-width="3"/>
        
        <!-- Intercom Speaker Grill -->
        <g fill="#334155">
          <circle cx="360" cy="460" r="4"/><circle cx="380" cy="460" r="4"/><circle cx="400" cy="460" r="4"/><circle cx="420" cy="460" r="4"/><circle cx="440" cy="460" r="4"/>
          <circle cx="370" cy="475" r="4"/><circle cx="390" cy="475" r="4"/><circle cx="410" cy="475" r="4"/><circle cx="430" cy="475" r="4"/>
          <circle cx="360" cy="490" r="4"/><circle cx="380" cy="490" r="4"/><circle cx="400" cy="490" r="4"/><circle cx="420" cy="490" r="4"/><circle cx="440" cy="490" r="4"/>
        </g>
        
        <!-- Contactless Card Tap Target Area -->
        <rect x="330" y="520" width="140" height="40" rx="8" fill="#1e293b"/>
        <text x="400" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">TEMPEL KARTU</text>
        
  </g>

  <!-- Product Title & Details Footer -->
  <g transform="translate(400, 685)">
    <rect x="-350" y="0" width="700" height="80" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="0" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">POS TIKET BARRIER DISPENSER OUTDOOR</text>
    <text x="0" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">HOUSING PLAT BESI POWDER COATING • THERMAL PRINTER TICKET • INTERCOM • RFID CARD DISPENSER</text>
  </g>
</svg>